name: Deploy index

on:
  push:
    paths:
      - public/site-index.json
      - public/.nojekyll
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: deweb-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
