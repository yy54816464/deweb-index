name: DeWEB index

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deweb-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build index
        env:
          CHAINS: bsc,xlayer
          SCAN_WINDOW: 100000
          CPU_MAX: 1490
          CPU_PRIORITY: "474,1188"
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: node indexer.mjs

      - name: Commit cursor
        run: |
          git config user.name "deweb-indexer"
          git config user.email "deweb-indexer@users.noreply.github.com"
          git add data/state.json public/site-index.json
          git diff --cached --quiet || git commit -m "index update [skip ci]"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
